name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Blender ${{ matrix.bpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            bpy: "5.0.1"
            extra_index: ""
          - python: "3.13"
            bpy: "5.2.1"
            extra_index: "https://download.blender.org/pypi/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        env:
          BPY_VERSION: ${{ matrix.bpy }}
          BPY_EXTRA_INDEX: ${{ matrix.extra_index }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$BPY_EXTRA_INDEX" ]; then
            python -m pip install pytest numpy "bpy==$BPY_VERSION" --extra-index-url "$BPY_EXTRA_INDEX"
          else
            python -m pip install pytest numpy "bpy==$BPY_VERSION"
          fi

      - name: Pure Python tests
        run: python -m pytest tests --ignore=tests/test_blender.py

      - name: Fast headless Blender checks
        run: python tests/blender_smoke.py

      - name: Generated presets and docs are current
        if: matrix.bpy == '5.0.1'
        run: |
          python tools/gen_presets.py
          python tools/gen_preset_docs.py
          git diff --exit-code

      - name: Build extension zip
        if: matrix.bpy == '5.0.1'
        run: python tools/build_extension.py

      - uses: actions/upload-artifact@v4
        if: matrix.bpy == '5.0.1'
        with:
          name: atmosfx-extension
          path: dist/*.zip
